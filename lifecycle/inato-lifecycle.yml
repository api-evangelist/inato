note: >-
  RECORDED ABSENCE across every lifecycle surface. No StatusPage, Deprecation,
  ChangeLog or RoadMap pointer is wired in apis.yml because none of those
  documents exists. Inato has no API to version, so the versioning and
  deprecation gaps are a consequence of that rather than independent failures —
  but the missing STATUS PAGE is a real gap in its own right: sites and sponsors
  running enrollment against the marketplace and against live EHR/CTMS syncs have
  no public way to distinguish an Inato outage from their own EHR's.
versioning:
  scheme: none
  policy_url: null
  detail: >-
    No API, therefore no API versioning policy. The downstream vendor APIs Inato
    calls are both v1-pathed (CRIO /api/v1/..., eClinPro /api/v1/...) but those
    are the vendors' versions, not Inato's.
