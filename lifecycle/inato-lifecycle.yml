method: searched
source: >-
  live probes 2026-08-17 of status.inato.com, inato.statuspage.io,
  inato.instatus.com, www.inato.com/status, www.inato.com/changelog,
  www.inato.com/roadmap, www.inato.com/sitemap.xml and the
