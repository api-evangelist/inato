provider_action: >-
  A public status page is the highest-value operational artifact Inato is
  missing. It is a hosted-vendor purchase, not an engineering project, and it
  covers a surface (marketplace + live EHR sync) where sites currently have to
  email a CSM to find out whether the platform is down.
