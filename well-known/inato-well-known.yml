note: >-
  RECORDED ABSENCE. Every /.well-known/ path was probed on every Inato host and
  every path returned a non-200 or an HTML shell. No `WellKnown` and no
  `SecurityTxt` pointer is wired in apis.yml, because the pointer asserts the
  provider SERVES that surface and Inato does not. inato.com returns a
  distinctive hard 404 body ("Invalid .well-known request") for every
  /.well-known/* path, which confirms the probe reached the origin rather than a
  catch-all. marketplace.inato.com (Next.js) and support.inato.com (a
  React/Vite SPA) both answer /.well-known/* with their own 404 pages.
