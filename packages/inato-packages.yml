note: >-
  IMPORTANT PROVENANCE NOTE — these are real, first-party, Inato-published open
  source packages, but NONE of them is a client SDK for an Inato API. Inato
  ships no public API (see ../apis.yml x-coverage), so there is nothing for an
  SDK to wrap. Every package below is general-purpose engineering tooling Inato
  open-sourced from its own product codebase: TypeScript form libraries, Effect
  / fp-ts helpers, and an OpenTelemetry instrumentation bundle. For that reason
  this file deliberately does NOT wire a `type: SDKs` pointer in apis.yml —
  sdk_count would be crediting Inato with client libraries for an API it does
  not publish. Recorded here because first-party package publishing and its
  release dates are real, dated, provider-published evidence of engineering
  activity.
