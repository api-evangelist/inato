frameworks:
- name: HIPAA
  detail: 'HIPAA "Preparatory to Research" (45 CFR 164.512); Business Associate Agreement (BAA) available and required before any EHR connector is enabled'
- name: ISO 27001
  detail: Information security management — claimed as a badge; certificate available on request, not published
- name: GDPR
  detail: >-
    EU data protection. Inato states the processor posture explicitly: "Inato
    processes the data on your behalf, under your instruction and
    authorization." Regional data-residency commitments claimed for the GCP
    environment.
controls:
- encryption: AES-256 for data at rest and in transit
- de_identification: >-
    Names, dates of birth, addresses and contact details are stripped the moment
    a file is uploaded or synced, before any AI processing begins
- pseudonymization: Records pseudonymized and stored under random identifiers in secure Google Cloud storage
- data_hosting: Google Cloud Platform (Inato-owned projects)
- network_defense: Google Cloud Armor for DDoS and external threat defense
- access_control: >-
    Logical access controls designed to prevent Inato staff from viewing
    identifiable patient data; sponsors see only aggregated, de-identified
    pre-screening insights
- retention: Original uploaded files are not retained in viewable form
- integration_posture: >-
    EHR integrations are read-only bulk FHIR — architecturally unable to write,
    modify or delete data in the site's EHR, and the site approves the access
    scope inside its own EHR
ai_governance:
- model: Google Gemini, deployed inside Inato's own Google Cloud projects
- no_third_party_llm: Patient data is never sent to any third-party US-based LLM provider
- no_training: >-
    No site or patient data is used to train AI models; Google does not use it to
    train their foundation models. Non-patient signals (user feedback on AI
    response accuracy) may be used to tune prompts and configuration
- human_in_the_loop: >-
    The AI flags and summarizes; the site team reviews every patient and makes
    every final call before anyone moves to screening
- explainability: >-
    Criterion-by-criterion summary of met / not met / unknown with the clinical
    evidence relied on, which the site team can read, challenge and override
- bias_control: Each patient is assessed against protocol criteria individually, never ranked against other patients
- purpose_limitation: >-
    Patient data is processed solely for the site's specific trial — not for
    product development, AI training or research, except as agreed in writing
contact: security@inato.com
documentation_on_request: >-
  Compliance documentation, security-review templates and the BAA are offered via
  security@inato.com rather than published for download.
