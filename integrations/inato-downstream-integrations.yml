downstream_contracts:
- vendor: CRIO
  owner: Clinical Research IO (clinicalresearch.io)
  reference: https://support.inato.com/docs/crio-integration-reference.html
  base_urls:
    production: https://api.clinicalresearch.io
    sandbox: https://app.sandbox-integration-useast1.sb.clinicalresearch.io
  auth: 'Authorization: Bearer <CRIO access token>, per Inato site'
  tenancy: 'every call carries ?client_id={CLIENT_ID}, issued by CRIO'
  operations:
  - name: Upsert patient
    method: POST
    path: /api/v1/patient?client_id={clientId}
    when: >-
      On "Link to CTMS" from an Inato eligibility report, and on every
      subsequent assessment status change.
  - name: Send pre-screening results
    method: POST
    path: /api/v1/patient/interaction?client_id={clientId}
    when: One call per assessment, immediately after the upsert returns patientId.
  - name: Get patient by site
    method: GET
    path: /api/v1/patient/{patientId}/site/{siteId}?client_id={clientId}
    when: Background sync of CRIO subject status back into the Inato eligibility report.
  - name: Get studies for site
    method: GET
    path: /api/v1/site/{siteId}?client_id={clientId}
    when: When the Inato trial-to-CRIO-study mapping modal is opened.
  - name: Get sites for client
    method: GET
    path: /api/v1/sites?client_id={clientId}
    when: Once per site, while Inato configures the integration.
  status_mapping:
    direction: Inato assessment status -> CRIO subjectStatus / recruitmentStatus
    map:
      toReview: PREQUALIFIED / PROSPECT
      toScreen: PREQUALIFIED / CONTACTING
      preScreenFailed: NOT_ELIGIBLE / INELIGIBLE
      notInterested: NOT_INTERESTED / NOT_INTERESTED
      screenFailed: SCREEN_FAIL / SCREEN_FAIL
      enrolled: ENROLLED / SUCCESS
      irrelevant match: NOT_ELIGIBLE / INELIGIBLE
    reverse: >-
      A CRIO -> Inato reverse mapping exists and is described as "used by the
      inbound webhook flow" and "intentionally lossier" (CRIO COMPLETED maps
      back to Inato enrolled). The webhook receiver itself is NOT documented as
      a public event surface, so no Webhooks pointer is wired from it.
  data_minimization:
  - No assessment-level structured eligibility data — only the human-readable
    summary in actionDetails.
  - No patient medical records.
  - No actions outside of the patient and the studies mapped to that patient.
- vendor: eClinPro
  owner: eClinPro (eclinpro.com)
  reference: https://support.inato.com/docs/eclinpro-integration-reference.html
  base_urls:
    production: https://eclinpro.com
    sandbox: https://demo.eclinpro.com
  auth: 'Authorization: <eClinPro access token>, per Inato site'
  error_convention:
    style: in-body success flag over HTTP 2xx
    detail: >-
      "eClinPro frequently returns HTTP 2xx with an in-body error of the shape
      {\"success\": false, \"error\": \"...\"}. Inato treats any such payload as
      a failure regardless of HTTP status. A successful response always carries
      \"success\": true." This is the single most useful runtime-semantics fact
      Inato publishes anywhere.
  operations:
  - name: Upsert patient
    method: POST
    path: /api/v1/patient
    when: On "Link to CTMS", and on every assessment status change.
  - name: Send pre-screening results
    method: POST
    path: /api/v1/patient/prescreening_summary
    when: One call per assessment, after the upsert returns patientId.
  - name: Get studies for site
    method: GET
    path: /api/v1/studies/{siteId}
    when: When the trial-to-study mapping modal is opened.
  - name: Get sites
    method: GET
    path: /api/v1/sites
    when: Once per site, while Inato configures the integration.
  status_mapping:
    direction: Inato assessment status -> eClinPro subjectStatus
    map:
      toReview: toReview
      toScreen: toScreen
      preScreenFailed: preScreenFailed
      notInterested: notInterested
      screenFailed: screenFailed
      enrolled: enrolled
      irrelevant match: preScreenFailed
  quirks:
  - >-
    Phone numbers are normalized to digits only with the country prefix REMOVED
    for eClinPro (+1 (415) 555-6666 -> 4155556666) because eClinPro's
    deduplication strips country codes. CRIO takes the same number with the
    prefix INCLUDED (14155556666). The same logical field is serialized two
    different ways for two different downstreams.
  - >-
    eClinPro deduplication precedence: email + cellPhone if email present, else
    birthDate + cellPhone if birthDate present, else cellPhone alone.
  - >-
    Assessments whose Inato trial is not mapped to a downstream study are
    SILENTLY DROPPED — no error is surfaced.
  data_minimization:
  - No assessment-level structured eligibility data — only the human-readable
    summary in details.
  - No patient medical records.
  - No actions outside of the patient and the studies mapped to that patient.
supported_ehr_vendor_list:
  count: 90
  note: >-
    The bulk-upload path publishes a list of ~90 EHR vendors whose EHI exports
    Inato can ingest (1upHealth, Cerner Millennium, MEDITECH, Veradigm, Tebra,
    Canvas Medical, Health Samurai and others). This is an ingest compatibility
    list, not an integration catalog — only the connectors above are live
    API/FHIR integrations.
