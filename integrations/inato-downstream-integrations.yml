ownership_note: >-
  READ THIS BEFORE DERIVING ANYTHING FROM THIS FILE. Every endpoint recorded
  here belongs to a THIRD PARTY, not to Inato. Inato publishes these two
  integration reference pages on its own support host describing the outbound
  calls IT MAKES to CRIO's API (api.clinicalresearch.io) and eClinPro's API
  (eclinpro.com). Per the pipeline ownership check, a contract is judged by what
  it says about itself: these specs name CRIO and eClinPro hosts, CRIO and
  eClinPro auth tokens, and CRIO and eClinPro object models. They are therefore
  NOT captured as an Inato OpenAPI, and no OpenAPI/APIReference pointer is wired
  from them. Inato is the API CONSUMER here. This artifact exists because the
  integration surface is real, published, dated and unusually well specified for
  a company with no public API of its own — it is the only place Inato documents
  machine-to-machine behaviour.
inato_publishes_an_api: false
role: consumer
integration_families:
- family: ehr-emr
  mechanism: bulk FHIR (read-only)
  direction: inbound (EHR -> Inato)
  statement: >-
    "Our integration with your EHR is established via bulk FHIR APIs that are
    configured as read-only. This means our platform is architecturally
    restricted from writing, modifying, or deleting any data within your EHR
    system."
  onboarding: >-
    Site admin installs/authorizes the Inato app inside their own EHR using
    Inato's published client ID, then emails prescreening@inato.com to finish
    configuration. Access scope is reviewed and approved by the site inside
    their EHR.
  requires: Business Associate Agreement (BAA) signed with Inato
- family: ctms
  mechanism: vendor REST API (bi-directional sync)
  direction: bi-directional (Inato <-> CTMS)
  statement: >-
    "Sync patients between your CTMS and Inato for seamless prescreening."
  documented_by: the two integration reference pages listed above
- family: bulk-upload
  mechanism: EHI export file upload
  direction: inbound
  statement: >-
    "Export your EHI data and upload it to Inato. Works with any EHR vendor."
