x-pointers-deliberately-omitted:
- type: DeveloperPortal
  reason: >-
    REMOVED 2026-08-17. It pointed at https://marketplace.inato.com/login, which
    is the end-user marketplace sign-in, not a developer portal. Inato publishes
    no developer portal; api./developer./docs.inato.com do not resolve.
- type: WellKnown
  reason: >-
    Every /.well-known/ path returns 404 on every Inato host — see
    well-known/inato-well-known.yml. The pointer would assert a served surface.
- type: SecurityTxt
  reason: /.well-known/security.txt is 404 on inato.com and www.inato.com.
- type: MCPServer
  reason: >-
    No MCP server exists, hosted or stdio, and there is no OpenAPI from which to
    derive a candidate tool list — see mcp/inato-mcp.yml (deployment mode none).
- type: AgentCard
  reason: >-
    /.well-known/agent-card.json and /.well-known/agent.json both 404 on every
    host. Per pipeline rule an agent card is never authored on a provider's
    behalf, so no a2a/ artifact was written at all.
- type: SDKs
  reason: >-
    The seven first-party npm packages in packages/inato-packages.yml are
    general-purpose TypeScript libraries, not client SDKs — there is no API for
    an SDK to wrap. sdk_count must not be credited.
- type: RateLimits
  reason: >-
    No API exists, so no rate limits can be published. A limit_count-0 artifact
    was deliberately NOT written, because the agent-readiness rate_limit_signal
    check awards partial credit for the mere presence of a rate_limits artifact.
- type: StatusPage
  reason: >-
    No status page — status.inato.com does not resolve; inato.statuspage.io and
    inato.instatus.com both redirect to the vendors' own marketing sites. See
    lifecycle/inato-lifecycle.yml.
- type: Deprecation
  reason: No deprecation or versioning policy is published (no API to version).
- type: ChangeLog
  reason: >-
    No change log or release-notes page; product news is narrative blog posts.
    /changelog is 404 on inato.com and a soft 404 on the support SPA.
- type: Webhooks
  reason: >-
    An inbound CRIO -> Inato webhook flow is mentioned once in the CRIO
    integration reference but is not documented as a public event surface.
- type: APIReference
  reason: >-
    The two integration reference pages on support.inato.com document CRIO's and
    eClinPro's APIs, not Inato's. Recorded under Integrations instead — see the
    ownership_note in integrations/inato-downstream-integrations.yml.
